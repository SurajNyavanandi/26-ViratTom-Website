<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="md-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="md-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#md-bg)"/>

  <!-- Top Navigation Header -->
  <rect width="1200" height="74" fill="#ffffff"/>
  <line x1="0" y1="74" x2="1200" y2="74" stroke="#e2e8f0"/>

  <!-- Brand Logo -->
  <g transform="translate(60, 22)">
    <circle cx="15" cy="15" r="15" fill="#0284c7"/>
    <path d="M9 15 L14 20 L21 11" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#0f172a" letter-spacing="-0.02em">MANA</text>
    <text x="115" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#0284c7">DRIVERS</text>
  </g>

  <!-- Nav links -->
  <g transform="translate(520, 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#475569">
    <text x="0" y="0" fill="#0284c7" font-weight="600">Hourly Drivers</text>
    <text x="125" y="0">Monthly Chauffeurs</text>
    <text x="290" y="0">Airport Drops</text>
    <text x="415" y="0">Outstation Trips</text>
  </g>

  <!-- Header CTA -->
  <g transform="translate(1010, 18)">
    <rect width="130" height="38" rx="10" fill="#0284c7"/>
    <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Book Driver Now</text>
  </g>

  <!-- Left Actual Hero Content -->
  <g transform="translate(60, 130)">
    <!-- Location Badge -->
    <rect width="260" height="28" rx="14" fill="#e0f2fe" stroke="#bae6fd"/>
    <text x="130" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle" letter-spacing="0.05em">PERSONAL CAR DRIVERS IN HYDERABAD</text>

    <!-- Main Headline -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#0f172a" letter-spacing="-0.03em" leading="1.15">
      <tspan x="0" dy="0">Book Verified Drivers</tspan>
      <tspan x="0" dy="54">for Your Personal Car by</tspan>
      <tspan x="0" dy="54" fill="#0284c7">the Hour or the Month.</tspan>
    </text>

    <!-- Subheadline -->
    <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748b">
      <tspan x="0" dy="0">Hourly freelance drivers and monthly permanent drivers across Hitec City,</tspan>
      <tspan x="0" dy="26">Gachibowli, Jubilee Hills, and RGIA Airport. Doorstep pickup in 30 minutes.</tspan>
    </text>

    <!-- CTAs -->
    <g transform="translate(0, 335)">
      <rect width="190" height="50" rx="12" fill="#0284c7"/>
      <text x="95" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Book in 60 Seconds →</text>

      <rect x="205" width="165" height="50" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="287" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#334155" text-anchor="middle">View Fixed Tariffs</text>
    </g>

    <!-- Key highlights -->
    <g transform="translate(0, 420)">
      <rect width="480" height="65" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <g transform="translate(20, 20)">
        <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a">✓ Police Background Checked</text>
        <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">Aadhaar &amp; Driving License Verified</text>
      </g>
      <line x1="240" y1="12" x2="240" y2="52" stroke="#e2e8f0"/>
      <g transform="translate(260, 20)">
        <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a">✓ Manual &amp; Automatic Cars</text>
        <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">SUVs, Sedans &amp; Luxury Vehicles</text>
      </g>
    </g>
  </g>

  <!-- Right Real Hero Card with Actual Driver Profile & Tariffs -->
  <g transform="translate(620, 115)">
    <!-- Main Card Container -->
    <rect width="520" height="500" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.04))"/>
    
    <!-- Top Card Strip -->
    <rect width="520" height="56" rx="20" fill="#f8fafc"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Instant Driver Booking &amp; Transparent Rates</text>
    <rect x="420" y="16" width="76" height="24" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <text x="458" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">ACTIVE NOW</text>

    <!-- Real Driver Profile Card with Cloudinary Chauffeur Image -->
    <g transform="translate(24, 78)">
      <rect width="472" height="150" rx="16" fill="#f0f9ff" stroke="#bae6fd"/>
      
      <!-- Chauffeur Image / Avatar -->
      <g transform="translate(18, 18)">
        <rect width="90" height="114" rx="12" fill="#e2e8f0"/>
        <image href="https://res.cloudinary.com/dfr0zghtc/image/upload/v1791976161/rider2_hdanc9.png" width="90" height="114" preserveAspectRatio="xMidYMid slice"/>
      </g>

      <!-- Profile details -->
      <g transform="translate(124, 24)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Shanker (Verified Driver)</text>
        <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0284c7">Gachibowli &amp; Financial District, Hyderabad</text>
        <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">8+ Years Experience • Manual &amp; Automatic Cars • Telugu, Hindi, English</text>
        
        <rect x="0" y="78" width="105" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="52" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">₹200 / hour</text>

        <rect x="115" y="78" width="140" height="26" rx="6" fill="#0284c7"/>
        <text x="185" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Book Driver Shanker</text>
      </g>
    </g>

    <!-- Pricing Options Grid (from real website) -->
    <g transform="translate(24, 248)">
      <!-- Tier 1: Hourly -->
      <g transform="translate(0, 0)">
        <rect width="226" height="105" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">01 • HOURLY CITY TRIP</text>
        <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a">₹150 – ₹180 <tspan font-size="12" font-weight="400" fill="#64748b">/hr</tspan></text>
        <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">Minimum 4 hrs billing</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0284c7">Shopping, office, dinners</text>
      </g>

      <!-- Tier 2: Airport Flat -->
      <g transform="translate(246, 0)">
        <rect width="226" height="105" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">02 • AIRPORT PICK &amp; DROP</text>
        <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a">₹600 – ₹800 <tspan font-size="12" font-weight="400" fill="#64748b">flat</tspan></text>
        <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">RGIA Shamshabad in your car</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0284c7">Day &amp; night flight drop</text>
      </g>

      <!-- Tier 3: Monthly Permanent -->
      <g transform="translate(0, 118)">
        <rect width="472" height="105" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">03 • MONTHLY FAMILY CHAUFFEUR</text>
        <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a">₹18,000 – ₹22,000 <tspan font-size="12" font-weight="400" fill="#64748b">/month</tspan></text>
        <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">8–9 hrs daily • 6 days/week • School runs, office, family</text>
        <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Verified permanent placement with free replacement</text>
      </g>
    </g>
  </g>
</svg>
