    <!-- Mandate Card 1: Bank Loans -->
    <g transform="translate(24, 76)">
      <rect width="472" height="120" rx="14" fill="#0b1329" stroke="#1e293b"/>
      <rect x="18" y="16" width="30" height="24" rx="6" fill="#1e3a8a"/>
      <text x="33" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#60a5fa" text-anchor="middle">01</text>
