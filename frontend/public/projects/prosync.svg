      <text x="100" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Check Loan Eligibility →</text>

      <rect x="215" width="165" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="297" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#e2e8f0" text-anchor="middle">Call +91 9951445544</text>
    </g>

    <!-- Quantitative Metrics Strip -->
