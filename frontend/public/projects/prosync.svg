        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Successfully Closed</text>
      </g>
      <line x1="160" y1="18" x2="160" y2="66" stroke="#1e293b"/>
      <g transform="translate(190, 26)">
        <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#38bdf8">10+ Years</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Advisory Leadership</text>
      </g>
      <line x1="325" y1="18" x2="325" y2="66" stroke="#1e293b"/>
      <g transform="translate(355, 26)">
        <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#38bdf8">₹500 Cr</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Max Single Facility</text>
      </g>
