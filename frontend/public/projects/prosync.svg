<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="ps-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="40%" stop-color="#0e1b38"/>
      <stop offset="100%" stop-color="#070c1a"/>
    </linearGradient>
    <linearGradient id="ps-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ps-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#ps-bg)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="850" cy="220" r="320" fill="#1d4ed8" fill-opacity="0.12"/>
  <circle cx="200" cy="600" r="250" fill="#2563eb" fill-opacity="0.08"/>

  <!-- Real Navigation Bar -->
  <rect width="1200" height="74" fill="#0b1329" fill-opacity="0.85"/>
  <line x1="0" y1="74" x2="1200" y2="74" stroke="#1e293b"/>

  <!-- Real Brand Logo -->
  <g transform="translate(60, 22)">
    <rect width="30" height="30" rx="7" fill="url(#ps-blue)"/>
    <path d="M8 15 L13 20 L22 10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">PROSYNC</text>
    <text x="135" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="300" fill="#93c5fd">CONSULTING</text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(540, 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
    <text x="0" y="0" fill="#60a5fa" font-weight="600">Home</text>
    <text x="75" y="0">Bank Loans</text>
    <text x="180" y="0">Debt Syndication</text>
    <text x="325" y="0">M&amp;A Advisory</text>
    <text x="445" y="0">Track Record</text>
  </g>

  <!-- Real Header CTA -->
  <g transform="translate(1015, 20)">
    <rect width="125" height="36" rx="8" fill="url(#ps-blue)"/>
    <text x="62" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Apply for Loan</text>
  </g>

  <!-- Left Real Hero Section -->
  <g transform="translate(60, 130)">
    <!-- Location Badge -->
    <rect width="250" height="28" rx="14" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4" fill="#38bdf8"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#bfdbfe" letter-spacing="0.04em">HYDERABAD &amp; TELANGANA ADVISORY</text>

    <!-- Real Headline -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.03em" leading="1.15">
