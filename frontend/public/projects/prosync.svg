      <text x="407" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Fast Sanction</text>
    </g>

    <!-- Mandate Card 2: HAM Infrastructure -->
    <g transform="translate(24, 210)">
      <rect width="472" height="120" rx="14" fill="#0b1329" stroke="#1e293b"/>
      <rect x="18" y="16" width="30" height="24" rx="6" fill="#1e3a8a"/>
      <text x="33" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#60a5fa" text-anchor="middle">02</text>
      <text x="58" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">HAM Road &amp; Infra Project Financing</text>
      <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Hybrid Annuity Model financial closure, NHAI concession tie-ups, and construction debt.</text>
      <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">₹50 Cr to ₹500 Cr • 15+ Yrs Tenor</text>
      <rect x="360" y="80" width="94" height="26" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="407" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">100% Closure</text>
    </g>

    <!-- Mandate Card 3: Debt Syndication & M&A -->
    <g transform="translate(24, 344)">
      <rect width="472" height="120" rx="14" fill="#0b1329" stroke="#1e293b"/>
      <rect x="18" y="16" width="30" height="24" rx="6" fill="#1e3a8a"/>
      <text x="33" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#60a5fa" text-anchor="middle">03</text>
      <text x="58" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Private Equity &amp; Debt Syndication</text>
      <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Connecting high-growth Telangana businesses with verified angel networks and family offices.</text>
      <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">High Equity Value • Zero Collateral</text>
      <rect x="360" y="80" width="94" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="407" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Growth Equity</text>
    </g>
  </g>
</svg>
