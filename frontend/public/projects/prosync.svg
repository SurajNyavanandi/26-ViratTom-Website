      <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Get low-interest loans from SBI, HDFC, ICICI, and Canara Bank with complete DPR preparation.</text>
      <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">₹10 Cr to ₹250 Cr • 10.5%–12.5% ROI</text>
